<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Where Is Jev Map</title>
<meta name="description" content="Step-by-step map of training-free storage tank detection: one aerial photo, a vision-language tile check, SAM 3 outlines and a check against hand labels.">
<script type="module" src="https://js.arcgis.com/5.2.2/"></script>
<style>
  :root { --bg: #ffffff; --fg: #1a1a1a; --muted: #555555; --line: #d0d0d0; --panel: #f6f6f4; --accent: #3e5c33; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #161816; --fg: #e8e8e4; --muted: #a8aba4; --line: #3a3d38; --panel: #1f221e; --accent: #9cc28a; }
  }
  :root[data-theme="dark"] { --bg: #161816; --fg: #e8e8e4; --muted: #a8aba4; --line: #3a3d38; --panel: #1f221e; --accent: #9cc28a; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  arcgis-map { flex: 1; min-width: 0; }
  aside { width: 360px; display: flex; flex-direction: column; overflow-y: auto; padding: 18px 20px; background: var(--panel); border-left: 1px solid var(--line); box-sizing: border-box; }
  h1 { font-size: 1.1em; margin: 0; color: var(--muted); font-weight: 600; }
  .count { color: var(--muted); font-size: 0.9em; margin: 14px 0 2px; }
  h2 { font-size: 1.4em; line-height: 1.25; margin: 0 0 10px; }
  p { margin: 0 0 10px; }
  .key { list-style: none; padding: 0; margin: 6px 0 12px; }
  .key li { display: flex; align-items: center; gap: 10px; margin: 6px 0; }
  .key b { font-variant-numeric: tabular-nums; min-width: 2.5em; text-align: right; }
  .swatch { width: 18px; height: 14px; flex: none; border: 2px solid; box-sizing: border-box; }
  nav { display: flex; gap: 8px; margin-top: auto; padding-top: 16px; }
  button { flex: 1; font: inherit; padding: 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--fg); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  button:disabled { opacity: 0.4; cursor: default; }
  .muted { color: var(--muted); font-size: 0.85em; }
  .error { color: #c62828; }
  @media (max-width: 600px) {
    body { flex-direction: column; }
    arcgis-map { flex: none; height: 55vh; }
    aside { width: 100%; border-left: 0; border-top: 1px solid var(--line); padding: 14px 16px; }
  }
</style>
</head>
<body>
<arcgis-map>
  <arcgis-zoom slot="top-left"></arcgis-zoom>
</arcgis-map>
<aside>
  <h1>Where Is Jev? Finding storage tanks with no training</h1>
  <p class="count" id="count"></p>
  <h2 id="title"></h2>
  <div id="body"></div>
  <ul class="key" id="key"></ul>
  <nav>
    <button id="back">Back</button>
    <button id="next" class="primary">Next</button>
  </nav>
  <p class="muted" id="status">Loading&hellip;</p>
</aside>
<script type="module" src="main.js"></script>
</body>
</html>
